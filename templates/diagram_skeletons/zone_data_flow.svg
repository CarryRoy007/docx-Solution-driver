<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680">
  <defs>
    <linearGradient id="gSource" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="gProcess" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="gTarget" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="gStore" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a5b4fc"/></linearGradient>
    <filter id="sd"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/></filter>
    <filter id="sds"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/></filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
    <marker id="agr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#10b981"/></marker>
  </defs>
  <style>
    text { font-family: "PingFang SC","Heiti SC","Microsoft YaHei","Hiragino Sans GB","Arial Unicode MS",sans-serif; }
  </style>
  <rect width="960" height="680" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">通用数据流转架构模板</text>

  <!-- Source Zone -->
  <g id="source-zone">
    <rect x="30" y="68" width="420" height="220" rx="8" fill="url(#gSource)" opacity="0.06"/>
    <rect x="30" y="68" width="420" height="220" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="50" y="94" font-size="14" font-weight="bold" fill="#1e40af">数据源</text>
    <rect x="50" y="108" width="180" height="44" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="140" y="135" text-anchor="middle" font-size="13" fill="#1e40af">业务数据库</text>
    <rect x="250" y="108" width="180" height="44" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="340" y="135" text-anchor="middle" font-size="13" fill="#1e40af">日志采集</text>
    <rect x="50" y="166" width="180" height="44" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="140" y="193" text-anchor="middle" font-size="13" fill="#1e40af">IoT 传感器</text>
    <rect x="250" y="166" width="180" height="44" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="340" y="193" text-anchor="middle" font-size="13" fill="#1e40af">第三方 API</text>
  </g>
  <line x1="450" y1="178" x2="500" y2="178" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <text x="460" y="170" font-size="10" fill="#3b82f6">采集</text>

  <!-- Process Zone -->
  <g id="process-zone">
    <rect x="510" y="68" width="420" height="220" rx="8" fill="url(#gProcess)" opacity="0.06"/>
    <rect x="510" y="68" width="420" height="220" rx="8" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="530" y="94" font-size="14" font-weight="bold" fill="#92400e">数据处理</text>
    <rect x="530" y="108" width="180" height="44" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#sds)"/><text x="620" y="135" text-anchor="middle" font-size="13" fill="#92400e">流式处理引擎</text>
    <rect x="730" y="108" width="180" height="44" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#sds)"/><text x="820" y="135" text-anchor="middle" font-size="13" fill="#92400e">数据清洗与转换</text>
    <rect x="530" y="166" width="180" height="44" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#sds)"/><text x="620" y="193" text-anchor="middle" font-size="13" fill="#92400e">特征工程</text>
    <rect x="730" y="166" width="180" height="44" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#sds)"/><text x="820" y="193" text-anchor="middle" font-size="13" fill="#92400e">数据质量校验</text>
  </g>
  <line x1="510" y1="178" x2="450" y2="288" stroke="#d97706" stroke-width="2" marker-end="url(#ao)"/>
  <text x="495" y="240" font-size="10" fill="#d97706">处理</text>

  <!-- Target Zone -->
  <g id="target-zone">
    <rect x="30" y="340" width="420" height="220" rx="8" fill="url(#gTarget)" opacity="0.06"/>
    <rect x="30" y="340" width="420" height="220" rx="8" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="50" y="366" font-size="14" font-weight="bold" fill="#065f46">数据消费</text>
    <rect x="50" y="380" width="180" height="44" rx="6" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#sds)"/><text x="140" y="407" text-anchor="middle" font-size="13" fill="#065f46">BI 分析报表</text>
    <rect x="250" y="380" width="180" height="44" rx="6" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#sds)"/><text x="340" y="407" text-anchor="middle" font-size="13" fill="#065f46">实时大屏</text>
    <rect x="50" y="438" width="180" height="44" rx="6" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#sds)"/><text x="140" y="465" text-anchor="middle" font-size="13" fill="#065f46">AI 模型训练</text>
    <rect x="250" y="438" width="180" height="44" rx="6" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#sds)"/><text x="340" y="465" text-anchor="middle" font-size="13" fill="#065f46">API 数据服务</text>
  </g>

  <!-- Storage Zone -->
  <g id="store-zone">
    <rect x="510" y="340" width="420" height="220" rx="8" fill="url(#gStore)" opacity="0.05"/>
    <rect x="510" y="340" width="420" height="220" rx="8" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="530" y="366" font-size="14" font-weight="bold" fill="#4c1d95">数据存储</text>
    <rect x="530" y="380" width="180" height="44" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="620" y="407" text-anchor="middle" font-size="13" fill="#4c1d95">数据湖</text>
    <rect x="730" y="380" width="180" height="44" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="820" y="407" text-anchor="middle" font-size="13" fill="#4c1d95">OLAP 引擎</text>
    <rect x="530" y="438" width="180" height="44" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="620" y="465" text-anchor="middle" font-size="13" fill="#4c1d95">时序数据库</text>
    <rect x="730" y="438" width="180" height="44" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="820" y="465" text-anchor="middle" font-size="13" fill="#4c1d95">图数据库</text>
  </g>

  <g transform="translate(30, 620)">
    <rect width="16" height="16" rx="3" fill="url(#gSource)" opacity="0.4" stroke="#3b82f6" stroke-width="1"/><text x="22" y="13" font-size="11" fill="#64748b">数据源</text>
    <rect x="95" y="0" width="16" height="16" rx="3" fill="url(#gProcess)" opacity="0.4" stroke="#d97706" stroke-width="1"/><text x="117" y="13" font-size="11" fill="#64748b">数据处理</text>
    <rect x="185" y="0" width="16" height="16" rx="3" fill="url(#gTarget)" opacity="0.4" stroke="#059669" stroke-width="1"/><text x="207" y="13" font-size="11" fill="#64748b">数据消费</text>
    <rect x="275" y="0" width="16" height="16" rx="3" fill="url(#gStore)" opacity="0.4" stroke="#6366f1" stroke-width="1"/><text x="297" y="13" font-size="11" fill="#64748b">数据存储</text>
  </g>
</svg>
