<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640">
  <defs>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="960" height="640" fill="#f8fafc"/>

  <text x="480" y="40" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">系统架构图</text>

  <g id="access-layer" filter="url(#shadow)">
    <rect x="40" y="80" width="880" height="130" rx="10" fill="url(#layer1)" opacity="0.95"/>
    <text x="60" y="110" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="16" font-weight="bold" fill="white">接入层</text>

    <g id="access-module-1">
      <rect x="60" y="125" width="200" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="160" y="160" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#1e40af">Web 门户</text>
    </g>
    <g id="access-module-2">
      <rect x="280" y="125" width="200" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="380" y="160" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#1e40af">移动端 APP</text>
    </g>
    <g id="access-module-3">
      <rect x="500" y="125" width="200" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="600" y="160" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#1e40af">API 网关</text>
    </g>
    <g id="access-module-4">
      <rect x="720" y="125" width="180" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="810" y="160" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#1e40af">第三方接入</text>
    </g>
  </g>

  <line x1="480" y1="210" x2="480" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g id="service-layer" filter="url(#shadow)">
    <rect x="40" y="250" width="880" height="130" rx="10" fill="url(#layer2)" opacity="0.95"/>
    <text x="60" y="280" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="16" font-weight="bold" fill="white">服务层</text>

    <g id="service-module-1">
      <rect x="60" y="295" width="200" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="160" y="330" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#047857">业务服务</text>
    </g>
    <g id="service-module-2">
      <rect x="280" y="295" width="200" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="380" y="330" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#047857">AI 引擎</text>
    </g>
    <g id="service-module-3">
      <rect x="500" y="295" width="200" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="600" y="330" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#047857">数据分析</text>
    </g>
    <g id="service-module-4">
      <rect x="720" y="295" width="180" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="810" y="330" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#047857">通知服务</text>
    </g>
  </g>

  <line x1="480" y1="380" x2="480" y2="415" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <g id="data-layer" filter="url(#shadow)">
    <rect x="40" y="420" width="880" height="130" rx="10" fill="url(#layer3)" opacity="0.95"/>
    <text x="60" y="450" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="16" font-weight="bold" fill="white">数据层</text>

    <g id="data-module-1">
      <rect x="60" y="465" width="250" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="185" y="500" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#92400e">关系型数据库</text>
    </g>
    <g id="data-module-2">
      <rect x="330" y="465" width="250" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="455" y="500" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#92400e">缓存服务</text>
    </g>
    <g id="data-module-3">
      <rect x="600" y="465" width="300" height="60" rx="6" fill="white" opacity="0.95"/>
      <text x="750" y="500" text-anchor="middle" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="14" fill="#92400e">分布式存储</text>
    </g>
  </g>

  <g id="legend" transform="translate(40, 570)">
    <rect width="12" height="12" rx="2" fill="url(#layer1)"/>
    <text x="18" y="11" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="12" fill="#64748b">接入层</text>
    <rect x="80" y="0" width="12" height="12" rx="2" fill="url(#layer2)"/>
    <text x="98" y="11" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="12" fill="#64748b">服务层</text>
    <rect x="160" y="0" width="12" height="12" rx="2" fill="url(#layer3)"/>
    <text x="178" y="11" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="12" fill="#64748b">数据层</text>
  </g>
</svg>
