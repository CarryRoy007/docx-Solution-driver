<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680">
  <defs>
    <linearGradient id="gGateway" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="gSvcA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="gSvcB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="gSvcC" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a5b4fc"/></linearGradient>
    <linearGradient id="gRegistry" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#f87171"/></linearGradient>
    <linearGradient id="gMQ" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <filter id="sd"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/></filter>
    <filter id="sds"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/></filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
  </defs>
  <style>
    text { font-family: "PingFang SC","Heiti SC","Microsoft YaHei","Hiragino Sans GB","Arial Unicode MS",sans-serif; }
  </style>
  <rect width="960" height="680" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">通用微服务架构模板</text>

  <!-- Gateway -->
  <g id="gateway-zone">
    <rect x="30" y="68" width="900" height="72" rx="8" fill="url(#gGateway)" opacity="0.06"/>
    <rect x="30" y="68" width="900" height="72" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="50" y="92" font-size="14" font-weight="bold" fill="#1e40af">API 网关层</text>
    <rect x="160" y="82" width="180" height="42" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="250" y="108" text-anchor="middle" font-size="12" fill="#1e40af">路由与负载均衡</text>
    <rect x="360" y="82" width="180" height="42" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="450" y="108" text-anchor="middle" font-size="12" fill="#1e40af">认证与鉴权</text>
    <rect x="560" y="82" width="180" height="42" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="650" y="108" text-anchor="middle" font-size="12" fill="#1e40af">限流与熔断</text>
    <rect x="760" y="82" width="150" height="42" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="835" y="108" text-anchor="middle" font-size="12" fill="#1e40af">链路追踪</text>
  </g>

  <!-- Service Zones -->
  <g id="svc-a">
    <rect x="30" y="175" width="280" height="200" rx="8" fill="url(#gSvcA)" opacity="0.05"/>
    <rect x="30" y="175" width="280" height="200" rx="8" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="50" y="200" font-size="14" font-weight="bold" fill="#92400e">订单服务</text>
    <rect x="50" y="215" width="240" height="36" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#sds)"/><text x="170" y="237" text-anchor="middle" font-size="12" fill="#92400e">订单创建</text>
    <rect x="50" y="260" width="240" height="36" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#sds)"/><text x="170" y="282" text-anchor="middle" font-size="12" fill="#92400e">订单查询</text>
    <rect x="50" y="305" width="240" height="36" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#sds)"/><text x="170" y="327" text-anchor="middle" font-size="12" fill="#92400e">订单状态机</text>
    <rect x="50" y="350" width="110" height="20" rx="4" fill="#92400e" opacity="0.1"/><text x="105" y="364" text-anchor="middle" font-size="10" fill="#92400e">数据库</text>
  </g>

  <g id="svc-b">
    <rect x="340" y="175" width="280" height="200" rx="8" fill="url(#gSvcB)" opacity="0.05"/>
    <rect x="340" y="175" width="280" height="200" rx="8" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="360" y="200" font-size="14" font-weight="bold" fill="#065f46">用户服务</text>
    <rect x="360" y="215" width="240" height="36" rx="6" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#sds)"/><text x="480" y="237" text-anchor="middle" font-size="12" fill="#065f46">用户注册登录</text>
    <rect x="360" y="260" width="240" height="36" rx="6" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#sds)"/><text x="480" y="282" text-anchor="middle" font-size="12" fill="#065f46">权限管理</text>
    <rect x="360" y="305" width="240" height="36" rx="6" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#sds)"/><text x="480" y="327" text-anchor="middle" font-size="12" fill="#065f46">用户画像</text>
    <rect x="360" y="350" width="110" height="20" rx="4" fill="#059669" opacity="0.1"/><text x="415" y="364" text-anchor="middle" font-size="10" fill="#059669">Redis</text>
  </g>

  <g id="svc-c">
    <rect x="650" y="175" width="280" height="200" rx="8" fill="url(#gSvcC)" opacity="0.05"/>
    <rect x="650" y="175" width="280" height="200" rx="8" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="670" y="200" font-size="14" font-weight="bold" fill="#4c1d95">通知服务</text>
    <rect x="670" y="215" width="240" height="36" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="790" y="237" text-anchor="middle" font-size="12" fill="#4c1d95">短信通知</text>
    <rect x="670" y="260" width="240" height="36" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="790" y="282" text-anchor="middle" font-size="12" fill="#4c1d95">邮件服务</text>
    <rect x="670" y="305" width="240" height="36" rx="6" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="790" y="327" text-anchor="middle" font-size="12" fill="#4c1d95">App Push</text>
    <rect x="670" y="350" width="110" height="20" rx="4" fill="#6366f1" opacity="0.1"/><text x="725" y="364" text-anchor="middle" font-size="10" fill="#6366f1">MQ</text>
  </g>

  <!-- Registry & MQ -->
  <g id="registry-zone">
    <rect x="30" y="410" width="440" height="90" rx="8" fill="url(#gRegistry)" opacity="0.04"/>
    <rect x="30" y="410" width="440" height="90" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="50" y="436" font-size="13" font-weight="bold" fill="#991b1b">服务注册与发现</text>
    <rect x="50" y="448" width="180" height="36" rx="5" fill="white" stroke="#dc2626" stroke-width="1.5" filter="url(#sds)"/><text x="140" y="470" text-anchor="middle" font-size="12" fill="#991b1b">Consul / Eureka</text>
    <rect x="250" y="448" width="200" height="36" rx="5" fill="white" stroke="#dc2626" stroke-width="1.5" filter="url(#sds)"/><text x="350" y="470" text-anchor="middle" font-size="12" fill="#991b1b">配置中心</text>
  </g>

  <g id="mq-zone">
    <rect x="490" y="410" width="440" height="90" rx="8" fill="url(#gMQ)" opacity="0.04"/>
    <rect x="490" y="410" width="440" height="90" rx="8" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="510" y="436" font-size="13" font-weight="bold" fill="#0e7490">异步消息</text>
    <rect x="510" y="448" width="180" height="36" rx="5" fill="white" stroke="#0891b2" stroke-width="1.5" filter="url(#sds)"/><text x="600" y="470" text-anchor="middle" font-size="12" fill="#0e7490">Kafka / RabbitMQ</text>
    <rect x="710" y="448" width="200" height="36" rx="5" fill="white" stroke="#0891b2" stroke-width="1.5" filter="url(#sds)"/><text x="810" y="470" text-anchor="middle" font-size="12" fill="#0e7490">事件总线</text>
  </g>

  <!-- Monitor -->
  <g id="monitor-zone">
    <rect x="30" y="530" width="900" height="62" rx="8" fill="#1e293b" opacity="0.03"/>
    <rect x="30" y="530" width="900" height="62" rx="8" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="50" y="555" font-size="13" font-weight="bold" fill="#475569">可观测性</text>
    <rect x="50" y="564" width="150" height="22" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/><text x="125" y="579" text-anchor="middle" font-size="11" fill="#475569">链路追踪</text>
    <rect x="215" y="564" width="150" height="22" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/><text x="290" y="579" text-anchor="middle" font-size="11" fill="#475569">日志聚合</text>
    <rect x="380" y="564" width="150" height="22" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/><text x="455" y="579" text-anchor="middle" font-size="11" fill="#475569">指标监控</text>
    <rect x="545" y="564" width="150" height="22" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/><text x="620" y="579" text-anchor="middle" font-size="11" fill="#475569">告警通知</text>
    <rect x="710" y="564" width="200" height="22" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/><text x="810" y="579" text-anchor="middle" font-size="11" fill="#475569">健康检查</text>
  </g>

  <g transform="translate(30, 625)">
    <rect width="16" height="16" rx="3" fill="url(#gGateway)" opacity="0.4" stroke="#3b82f6" stroke-width="1"/><text x="22" y="13" font-size="10" fill="#64748b">API网关</text>
    <rect x="95" y="0" width="16" height="16" rx="3" fill="url(#gSvcA)" opacity="0.4" stroke="#d97706" stroke-width="1"/><text x="117" y="13" font-size="10" fill="#64748b">服务A</text>
    <rect x="160" y="0" width="16" height="16" rx="3" fill="url(#gSvcB)" opacity="0.4" stroke="#059669" stroke-width="1"/><text x="182" y="13" font-size="10" fill="#64748b">服务B</text>
    <rect x="225" y="0" width="16" height="16" rx="3" fill="url(#gSvcC)" opacity="0.4" stroke="#6366f1" stroke-width="1"/><text x="247" y="13" font-size="10" fill="#64748b">服务C</text>
    <rect x="290" y="0" width="16" height="16" rx="3" fill="url(#gRegistry)" opacity="0.4" stroke="#dc2626" stroke-width="1"/><text x="312" y="13" font-size="10" fill="#64748b">注册中心</text>
    <rect x="380" y="0" width="16" height="16" rx="3" fill="url(#gMQ)" opacity="0.4" stroke="#0891b2" stroke-width="1"/><text x="402" y="13" font-size="10" fill="#64748b">消息队列</text>
  </g>
</svg>
