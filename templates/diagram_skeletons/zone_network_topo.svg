<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680">
  <defs>
    <linearGradient id="gExt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#f87171"/></linearGradient>
    <linearGradient id="gDMZ" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="gApp" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="gData" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="gMgmt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a5b4fc"/></linearGradient>
    <filter id="sd"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/></filter>
    <filter id="sds"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/></filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  </defs>
  <style>
    text { font-family: "PingFang SC","Heiti SC","Microsoft YaHei","Hiragino Sans GB","Arial Unicode MS",sans-serif; }
  </style>
  <rect width="960" height="680" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">通用网络拓扑架构模板</text>

  <!-- External -->
  <g id="ext-zone">
    <rect x="30" y="68" width="900" height="72" rx="8" fill="url(#gExt)" opacity="0.04"/>
    <rect x="30" y="68" width="900" height="72" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="50" y="92" font-size="13" font-weight="bold" fill="#991b1b">外部网络</text>
    <rect x="50" y="100" width="120" height="30" rx="5" fill="white" stroke="#dc2626" stroke-width="1.5" filter="url(#sds)"/><text x="110" y="120" text-anchor="middle" font-size="11" fill="#991b1b">互联网</text>
    <rect x="185" y="100" width="120" height="30" rx="5" fill="white" stroke="#dc2626" stroke-width="1.5" filter="url(#sds)"/><text x="245" y="120" text-anchor="middle" font-size="11" fill="#991b1b">专线接入</text>
    <rect x="320" y="100" width="140" height="30" rx="5" fill="white" stroke="#dc2626" stroke-width="1.5" filter="url(#sds)"/><text x="390" y="120" text-anchor="middle" font-size="11" fill="#991b1b">DDoS 防护</text>
    <rect x="475" y="100" width="120" height="30" rx="5" fill="white" stroke="#dc2626" stroke-width="1.5" filter="url(#sds)"/><text x="535" y="120" text-anchor="middle" font-size="11" fill="#991b1b">CDN</text>
  </g>

  <!-- DMZ -->
  <g id="dmz-zone">
    <rect x="30" y="162" width="900" height="110" rx="8" fill="url(#gDMZ)" opacity="0.05"/>
    <rect x="30" y="162" width="900" height="110" rx="8" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="50" y="188" font-size="13" font-weight="bold" fill="#92400e">DMZ 隔离区</text>
    <rect x="50" y="200" width="280" height="40" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#sds)"/><text x="190" y="225" text-anchor="middle" font-size="12" fill="#92400e">WAF 防火墙</text>
    <rect x="345" y="200" width="280" height="40" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#sds)"/><text x="485" y="225" text-anchor="middle" font-size="12" fill="#92400e">反向代理 Nginx</text>
    <rect x="640" y="200" width="270" height="40" rx="6" fill="white" stroke="#d97706" stroke-width="1.5" filter="url(#sds)"/><text x="775" y="225" text-anchor="middle" font-size="12" fill="#92400e">API 网关集群</text>
  </g>

  <!-- App -->
  <g id="app-zone">
    <rect x="30" y="295" width="580" height="220" rx="8" fill="url(#gApp)" opacity="0.05"/>
    <rect x="30" y="295" width="580" height="220" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="50" y="320" font-size="13" font-weight="bold" fill="#1e40af">应用服务区</text>
    <rect x="50" y="335" width="250" height="40" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="175" y="360" text-anchor="middle" font-size="12" fill="#1e40af">Web 应用服务器 × 2</text>
    <rect x="315" y="335" width="275" height="40" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="452" y="360" text-anchor="middle" font-size="12" fill="#1e40af">业务微服务集群 (K8s)</text>
    <rect x="50" y="390" width="250" height="40" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="175" y="415" text-anchor="middle" font-size="12" fill="#1e40af">消息中间件</text>
    <rect x="315" y="390" width="275" height="40" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="452" y="415" text-anchor="middle" font-size="12" fill="#1e40af">缓存集群 (Redis)</text>
    <rect x="50" y="445" width="250" height="40" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="175" y="470" text-anchor="middle" font-size="12" fill="#1e40af">搜索引擎 (ES)</text>
    <rect x="315" y="445" width="275" height="40" rx="6" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#sds)"/><text x="452" y="470" text-anchor="middle" font-size="12" fill="#1e40af">文件服务</text>
  </g>

  <!-- Data -->
  <g id="data-zone">
    <rect x="640" y="295" width="290" height="220" rx="8" fill="url(#gData)" opacity="0.05"/>
    <rect x="640" y="295" width="290" height="220" rx="8" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="660" y="320" font-size="13" font-weight="bold" fill="#065f46">数据存储区</text>
    <rect x="660" y="335" width="250" height="40" rx="6" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#sds)"/><text x="785" y="360" text-anchor="middle" font-size="12" fill="#065f46">主数据库(主从)</text>
    <rect x="660" y="390" width="250" height="40" rx="6" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#sds)"/><text x="785" y="415" text-anchor="middle" font-size="12" fill="#065f46">只读副本</text>
    <rect x="660" y="445" width="250" height="40" rx="6" fill="white" stroke="#059669" stroke-width="1.5" filter="url(#sds)"/><text x="785" y="470" text-anchor="middle" font-size="12" fill="#065f46">备份与归档</text>
  </g>

  <!-- Management -->
  <g id="mgmt-zone">
    <rect x="30" y="540" width="900" height="62" rx="8" fill="url(#gMgmt)" opacity="0.04"/>
    <rect x="30" y="540" width="900" height="62" rx="8" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="50" y="565" font-size="13" font-weight="bold" fill="#4c1d95">管理网络</text>
    <rect x="50" y="573" width="160" height="22" rx="4" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="130" y="588" text-anchor="middle" font-size="11" fill="#4c1d95">堡垒机</text>
    <rect x="225" y="573" width="160" height="22" rx="4" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="305" y="588" text-anchor="middle" font-size="11" fill="#4c1d95">监控中心</text>
    <rect x="400" y="573" width="160" height="22" rx="4" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="480" y="588" text-anchor="middle" font-size="11" fill="#4c1d95">日志中心</text>
    <rect x="575" y="573" width="160" height="22" rx="4" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="655" y="588" text-anchor="middle" font-size="11" fill="#4c1d95">配置管理</text>
    <rect x="750" y="573" width="160" height="22" rx="4" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#sds)"/><text x="830" y="588" text-anchor="middle" font-size="11" fill="#4c1d95">备份恢复</text>
  </g>

  <g transform="translate(30, 630)">
    <rect width="16" height="16" rx="3" fill="url(#gExt)" opacity="0.3" stroke="#dc2626" stroke-width="1"/><text x="22" y="13" font-size="10" fill="#64748b">外部网络</text>
    <rect x="98" y="0" width="16" height="16" rx="3" fill="url(#gDMZ)" opacity="0.3" stroke="#d97706" stroke-width="1"/><text x="120" y="13" font-size="10" fill="#64748b">DMZ</text>
    <rect x="160" y="0" width="16" height="16" rx="3" fill="url(#gApp)" opacity="0.3" stroke="#3b82f6" stroke-width="1"/><text x="182" y="13" font-size="10" fill="#64748b">应用区</text>
    <rect x="232" y="0" width="16" height="16" rx="3" fill="url(#gData)" opacity="0.3" stroke="#059669" stroke-width="1"/><text x="254" y="13" font-size="10" fill="#64748b">数据区</text>
    <rect x="304" y="0" width="16" height="16" rx="3" fill="url(#gMgmt)" opacity="0.3" stroke="#6366f1" stroke-width="1"/><text x="326" y="13" font-size="10" fill="#64748b">管理网</text>
  </g>
</svg>
